{% extends 'base.html' %}{% block title %}Edit Equipment · SaLUT{% endblock %}{% block content %}<a class="back" href="{{ url_for('inventory_add') }}">← Back to inventory</a><section class="page-heading"><div class="eyebrow">INVENTORY MANAGEMENT</div><h1>Edit equipment</h1><p class="muted">Equipment ID: {{ item['Equipment ID'] }}. Status and current location are updated by sign-in/sign-out transactions.</p></section><form method="post" class="panel stack"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><div class="form-grid"><label>Item name *<input name="name" value="{{ item['Item Name'] }}" required></label><label>Category *<select name="category" required>{% for c in categories %}<option value="{{ c }}" {% if c==item['Category'] %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label></div><div class="form-actions"><a class="btn secondary" href="{{ url_for('inventory_add') }}">Cancel</a><button class="btn primary" type="submit">Save changes</button></div></form>{% endblock %}
